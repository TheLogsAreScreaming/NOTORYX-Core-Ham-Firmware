# NOTORYX Ham test: W1AW and KD2ABC can only reach each other through the repeater (Hilltop).
defaults:
  node:
    radio:
      frequency_hz: 906875000
      bandwidth_hz: 250000
      spreading_factor: 10
      coding_rate: 5
      tx_power_dbm: 20

nodes:
  - name: "W1AW"
    location: { lat: 47.6000, lon: -122.4000 }
    firmware: { type: Companion }
  - name: "Hilltop"
    location: { lat: 47.6100, lon: -122.3800 }
    firmware: { type: Repeater }
  - name: "KD2ABC"
    location: { lat: 47.6200, lon: -122.3600 }
    firmware: { type: Companion }

edges:
  - { from: "W1AW", to: "Hilltop", mean_snr_db_at20dbm: 12.0 }
  - { from: "Hilltop", to: "W1AW", mean_snr_db_at20dbm: 12.0 }
  - { from: "Hilltop", to: "KD2ABC", mean_snr_db_at20dbm: 12.0 }
  - { from: "KD2ABC", to: "Hilltop", mean_snr_db_at20dbm: 12.0 }
